# Runs the local suite that CONTRIBUTING.md lists on every pull request and
# on every push to development. The token is read-only through
# `permissions`, and the workflow reads no secret. Keep `pull_request`:
# `pull_request_target` would run a fork's code with the base's access. The job must not be named `source-branch`: the
# master ruleset requires that check from master-source-branch.yml only.
# Actions are pinned by commit SHA; the comment names the release.
name: tests

on:
  pull_request:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A newer push to a pull request replaces its run; every push to
  # development keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Pi and OpenCode tests run TypeScript through Node, which must
      # strip the types itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # tomllib needs Python 3.11 or newer.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tool versions
        run: |
          go version
          node --version
          python3 --version
      # Each step runs in a new shell, so each sets the umask the tests of
      # tooling/management and tooling/package expect.
      - name: go vet
        run: |
          umask 022
          go vet ./...
      - name: go test
        run: |
          umask 022
          go test ./...
      - name: Python skill tests
        run: |
          umask 022
          python3 -m unittest discover -s tests/skills -p '*_test.py'
