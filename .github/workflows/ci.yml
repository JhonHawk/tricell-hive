name: CI

on:
  pull_request:
    branches: [development]
    paths-ignore:
      - "_support/openspec/**"
      - "_support/sessions/**"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Leaves room for setup, vet and race compilation before go test's own
    # 40-minute timeout, so a hung test ends with Go's goroutine dump.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The flow tests run TypeScript fixtures directly with node.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: go vet ./...
      - run: go test -race -timeout 40m ./...
      - run: python3 -m unittest discover -s tests/skills -p '*_test.py'
