# Build scripts explicitly reviewed and approved (pnpm 10+ blocks postinstall
# scripts by default). esbuild/sharp: prebuilt native deps used by Astro/Vite for
# bundling + image optimization. Add `lefthook: true` here if git hooks are opted in.
allowBuilds:
  esbuild: true
  sharp: true

# If a freshly-released pinned version is newer than the global pnpm
# `minimumReleaseAge` cooldown, exclude it here, e.g.:
# minimumReleaseAgeExclude:
#   - '@astrojs/starlight@0.41.3'
